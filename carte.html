<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte interactive — Yoon Wu Wóor</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>.site-foot,.road{display:none}</style>
</head>
<body>
<main class="map-layout">
  <aside class="map-side">
    <h2 style="font-size:1.9rem;margin-bottom:6px">Carte du Sénégal</h2>
    <p class="muted" style="font-size:.92rem">Risques routiers et services aux usagers. Cliquez sur un point pour le détail.</p>
    <label class="ctl" style="margin:14px 0">Aller à une région
      <select id="go"><option value="">Tout le Sénégal</option></select>
    </label>
    <div class="eyebrow" style="margin-top:18px">Risques</div>
    <div id="lay-risk"></div>
    <div class="eyebrow" style="margin-top:18px">Services</div>
    <div id="lay-serv"></div>
    <div class="eyebrow" style="margin-top:18px">Référentiels</div>
    <div id="lay-ref"></div>
    <div class="note" style="margin-top:16px">Points d'intérêt et zones accidentogènes <b>simulés</b> pour la démonstration. Raccordement prévu aux bases ANASER, DTR et forces de sécurité.</div>
  </aside>
  <div id="map" role="application" aria-label="Carte interactive"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="assets/js/common.js"></script>
<script>
YWW.mount('carte');
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([14.4,-14.6],7);
const light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap, © CARTO',maxZoom:19});
const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap, © CARTO',maxZoom:19});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
(YWW.isDark()?dark:light).addTo(map);
L.control.layers({'Plan clair':light,'Plan sombre':dark,'OpenStreetMap':osm,'Satellite':sat},null,{position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const ICON={
  zone:['#e31b23','<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>'],
  cct:['#2b6cb0','<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>'],
  autoecole:['#7b3fbf','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v6.5M4.5 15.5l5.3-2.4M19.5 15.5l-5.3-2.4"/>'],
  gare:['#00853f','<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M8 21v-4M16 21v-4"/>'],
  secours:['#ff6b00','<path d="M12 5v14M5 12h14"/>']
};
const LBL={zone:'Zones accidentogènes',cct:'Centres de contrôle technique',autoecole:'Auto-écoles',gare:'Gares routières',secours:'Centres de secours'};
const pinIcon=c=>L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26],html:`<div class="pin" style="background:${ICON[c][0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${ICON[c][1]}</svg></div>`});
const groups={}, counts={};
const params=new URLSearchParams(location.search), only=params.get('couche');

Promise.all([YWW.json('data/points.geojson'),YWW.json('data/routes.geojson'),YWW.json('data/regions.geojson'),YWW.json('data/departements.geojson')]).then(([pts,routes,regs,deps])=>{
  // référentiels
  const regL=L.geoJSON(regs,{style:{color:'#12161d',weight:2,fill:false,opacity:.7}});
  const depL=L.geoJSON(deps,{style:{color:'#6b7280',weight:1,dashArray:'4 3',fill:false}});
  const rouL=L.geoJSON(routes,{style:{color:'#f5b700',weight:4,opacity:.9},onEachFeature:(f,l)=>l.bindTooltip('Route nationale '+f.properties.route.replace('N','')+' (RN'+f.properties.route.replace('N','')+')',{sticky:true})});
  // points
  const byCat={};
  pts.features.forEach(f=>{(byCat[f.properties.cat]=byCat[f.properties.cat]||[]).push(f)});
  Object.keys(byCat).forEach(c=>counts[c]=byCat[c].length);
  const popup=p=>{
    let h=`<b>${p.nom}</b><br><span style="color:#666">${p.ville||p.route||''}</span><br>${p.info}`;
    if(p.cat==='zone') h+=`<br><br><b>${p.acc}</b> accidents · <b>${p.tues}</b> tués (5 ans)<br>Gravité : ${'●'.repeat(p.grav)}${'○'.repeat(3-p.grav)}`;
    return h;
  };
  // zones : cercles proportionnels + heatmap
  const zoneL=L.layerGroup(byCat.zone.map(f=>{const [lo,la]=f.geometry.coordinates;const p=f.properties;
    return L.circleMarker([la,lo],{radius:5+p.grav*3,color:'#fff',weight:1.5,fillColor:['#f5b700','#ff7a00','#e31b23'][p.grav-1],fillOpacity:.85}).bindPopup(popup(p))}));
  const heatL=L.heatLayer(byCat.zone.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0],f.properties.grav/3]),{radius:28,blur:22,minOpacity:.35,gradient:{.3:'#f5b700',.6:'#ff7a00',1:'#e31b23'}});
  groups.zone=zoneL; groups.heat=heatL;
  ['cct','gare','secours'].forEach(c=>groups[c]=L.layerGroup(byCat[c].map(f=>L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{icon:pinIcon(c)}).bindPopup(popup(f.properties)))));
  const cl=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45});
  byCat.autoecole.forEach(f=>cl.addLayer(L.marker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{icon:pinIcon('autoecole')}).bindPopup(popup(f.properties))));
  groups.autoecole=cl; groups.routes=rouL; groups.regions=regL; groups.deps=depL;

  const def={zone:true,heat:false,cct:true,autoecole:true,gare:true,secours:false,routes:true,regions:true,deps:false};
  if(only){Object.keys(def).forEach(k=>{if(!['routes','regions'].includes(k))def[k]=false});def[only]=true;if(only==='heat')def.zone=false}
  const row=(id,label,color,iconKey,n)=>`<label class="layer"><input type="checkbox" data-k="${id}" ${def[id]?'checked':''}><span class="sw" style="background:${color}">${iconKey?`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${ICON[iconKey][1]}</svg>`:''}</span>${label}${n?`<span class="n">${n}</span>`:''}</label>`;
  document.getElementById('lay-risk').innerHTML=row('zone','Zones accidentogènes','#e31b23','zone',counts.zone)+row('heat','Densité (carte de chaleur)','linear-gradient(135deg,#f5b700,#e31b23)',null);
  document.getElementById('lay-serv').innerHTML=['cct','autoecole','gare','secours'].map(c=>row(c,LBL[c],ICON[c][0],c,counts[c])).join('');
  document.getElementById('lay-ref').innerHTML=row('routes','Routes nationales','#f5b700',null)+row('regions','Limites régionales','#12161d',null)+row('deps','Limites départementales','#6b7280',null);
  // ordre d'affichage
  ['regions','deps','routes','heat','zone','gare','cct','secours','autoecole'].forEach(k=>{if(def[k])groups[k].addTo(map)});
  document.querySelectorAll('.layer input').forEach(i=>i.addEventListener('change',()=>{const g=groups[i.dataset.k];i.checked?g.addTo(map):map.removeLayer(g)}));
  // légende gravité
  const lg=L.control({position:'bottomright'});
  lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<b>Gravité des sections</b><br><i style="background:#e31b23;border-radius:50%"></i>Élevée<br><i style="background:#ff7a00;border-radius:50%"></i>Moyenne<br><i style="background:#f5b700;border-radius:50%"></i>Modérée';return d};
  lg.addTo(map);
  // aller à
  const go=document.getElementById('go');
  regs.features.slice().sort((a,b)=>a.properties.NAME.localeCompare(b.properties.NAME)).forEach(f=>go.insertAdjacentHTML('beforeend',`<option value="${f.properties.GID_1}">${f.properties.NAME}</option>`));
  go.addEventListener('change',()=>{if(!go.value){map.setView([14.4,-14.6],7);return}regL.eachLayer(l=>{if(l.feature.properties.GID_1===go.value)map.fitBounds(l.getBounds(),{padding:[20,20]})})});
  map.fitBounds(regL.getBounds(),{padding:[10,10]});
});
</script>
</body>
</html>
